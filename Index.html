<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trip App - SuperApp & Desktop</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Material Symbols, Font, & SweetAlert2 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,0..1,0,24&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            cyan: { 400: '#00D1FF', 500: '#00B8E6', 600: '#0097bf' },
            dark: { surface: '#1a1a1a', border: '#2A2A2A', bg: '#121212' },
            light: { surface: '#ffffff', border: '#e5e7eb', bg: '#f9fafb' }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #393939; border-radius: 10px; }
    html:not(.dark) ::-webkit-scrollbar-thumb { background: #cbd5e1; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    
    .toast-enter { animation: slideDown 0.3s ease-out forwards; }
    @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .icon-filled { font-variation-settings: 'FILL' 1; }

    .swal2-popup.swal-dark { background: #1a1a1a !important; color: #fff !important; border: 1px solid #2A2A2A; border-radius: 24px !important; }
    .swal2-popup.swal-light { background: #fff !important; color: #111827 !important; border: 1px solid #e5e7eb; border-radius: 24px !important; }
    .swal2-title { font-family: 'Inter', sans-serif; font-weight: 900 !important; font-size: 1.25rem !important; }
    .swal2-html-container { font-family: 'Inter', sans-serif; font-weight: 500 !important; font-size: 0.875rem !important; }
    .swal2-confirm, .swal2-cancel { border-radius: 12px !important; font-weight: 800 !important; font-size: 0.75rem !important; text-transform: uppercase; letter-spacing: 0.05em; }

    @media print {
      @page { margin: 1cm; size: A4; }
      html, body { background: white !important; color: black !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; overflow: visible !important; height: auto !important; }
      
      /* Hide all UI elements */
      nav, aside, button, .print\:hidden, [role="navigation"], .fixed, .absolute, .toast, .swal2-container, #mobile-bottom-nav { display: none !important; }
      
      /* Reset container for print */
      #root, #root > div, .flex-1, main { 
        display: block !important; 
        overflow: visible !important; 
        height: auto !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        position: static !important;
        border: none !important;
        background: transparent !important;
      }

      #printable-report {
        display: block !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        background: white !important;
        color: black !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }

      /* Ensure text is black and background-colors are printed */
      #printable-report * { color: black !important; background-color: transparent !important; border-color: #eee !important; box-shadow: none !important; }
      #printable-report h2, #printable-report h3, #printable-report h4, #printable-report .font-black { color: #000 !important; }
      
      /* Preserve specific colors for clarity in report */
      #printable-report .text-cyan-600, #printable-report .text-cyan-400 { color: #0891b2 !important; font-weight: bold !important; }
      #printable-report .text-red-500 { color: #dc2626 !important; font-weight: bold !important; }
      #printable-report .text-green-600 { color: #16a34a !important; font-weight: bold !important; }
      
      /* Force backgrounds for bars and stats cards */
      #printable-report .bg-gray-50, #printable-report .bg-light-bg, #printable-report .dark\:bg-white\/5 { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact !important; }
      #printable-report .bg-cyan-50 { background-color: #ecfeff !important; -webkit-print-color-adjust: exact !important; }
      #printable-report .bg-cyan-500 { background-color: #06b6d4 !important; -webkit-print-color-adjust: exact !important; }
      #printable-report .bg-red-500 { background-color: #ef4444 !important; -webkit-print-color-adjust: exact !important; }
      #printable-report .bg-gray-100 { background-color: #f3f4f6 !important; -webkit-print-color-adjust: exact !important; }

      /* Table specific */
      #printable-report table { width: 100% !important; border-collapse: collapse !important; }
      #printable-report th { background-color: #f9fafb !important; -webkit-print-color-adjust: exact !important; }
    }
  </style>

  <!-- DATABASE CONNECTION & FALLBACK MOCK YANG TELAH DISAMAKAN STRUKTURNYA -->
  <script>
    const isGAS = typeof google !== 'undefined' && typeof google.script !== 'undefined' && typeof google.script.run !== 'undefined';

    if (!isGAS) {
      console.warn("Berjalan di Canvas/Lokal. Menggunakan Data Simulasi (Mock DB).");
      const mockDB = {
        trips: [
          { trip_id: "1", trip_name: "Liburan Keluarga Jepang", description: "Jalan santai", start_date: "2026-06-10", end_date: "2026-06-15", budget: 35000000, currency: "Rp", creator: "admin@trip.com", image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=800&auto=format&fit=crop" }
        ],
        destinations: [], expenses: [], members: [ { member_id: "m1", trip_id: "1", email: "admin@trip.com", name: "Iwan Tingwe", role: "owner", status: "active" } ]
      };

      // Mock API Runner agar support metode ".withSuccessHandler" dan ".withFailureHandler" berantai (Chaining) secara persis seperti Apps Script
      const createRunner = (successCb, failureCb) => ({
        withSuccessHandler: function(cb) { return createRunner(cb, failureCb); },
        withFailureHandler: function(cb) { return createRunner(successCb, cb); },
        
        login: function(data) { setTimeout(() => { try { if (data.email) { if(successCb) successCb({ success: true, data: { email: data.email, name: data.email.split('@')[0] }, message: "Berhasil masuk!" }); } else { if(successCb) successCb({ success: false, message: "Email wajib diisi!" }); } } catch(e) { if(failureCb) failureCb(e); } }, 800); },
        getCurrentUser: function() { setTimeout(() => { if(successCb) successCb(null); }, 100); },
        getMyTrips: function(email) { setTimeout(() => { try { if(successCb) successCb({ success: true, data: mockDB.trips }); } catch(e) { if(failureCb) failureCb(e); } }, 200); },
        createTrip: function(data) { setTimeout(() => { try { const newTrip = { ...data, trip_id: "t"+Date.now(), image: "https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=600&auto=format&fit=crop" }; mockDB.trips.push(newTrip); mockDB.members.push({member_id: "m"+Date.now(), trip_id: newTrip.trip_id, email: data.creator, name: data.creatorName, role: "owner", status: "active"}); if(successCb) successCb({ success: true, tripId: newTrip.trip_id, message: "Trip Berhasil Dibuat" }); } catch(e) { if(failureCb) failureCb(e); } }, 400); },
        updateTrip: function(data) { setTimeout(() => { try { const idx = mockDB.trips.findIndex(t => t.trip_id === data.trip_id); if(idx > -1) mockDB.trips[idx] = {...mockDB.trips[idx], ...data}; if(successCb) successCb({success:true, message:"Trip diperbarui"}); } catch(e) { if(failureCb) failureCb(e); } }, 300); },
        deleteTrip: function(id) { setTimeout(() => { try { mockDB.trips = mockDB.trips.filter(t => t.trip_id !== id); if(successCb) successCb({success:true, message:"Trip dihapus"}); } catch(e) { if(failureCb) failureCb(e); } }, 300); },
        getItinerary: function(id) { setTimeout(() => { if(successCb) successCb({ success: true, data: mockDB.destinations }); }, 200); },
        getExpenses: function(id) { setTimeout(() => { if(successCb) successCb({ success: true, data: mockDB.expenses }); }, 200); },
        getBalances: function(id) { setTimeout(() => { if(successCb) successCb({ success: true, data: [], total_expense: 0, total_members: 1 }); }, 300); },
        getMembers: function(id) { setTimeout(() => { if(successCb) successCb({ success: true, data: mockDB.members }); }, 200); },
        addItinerary: function(data) { setTimeout(() => { if(successCb) successCb({success: true, message: "Sukses"}); }, 300); },
        addExpense: function(data) { setTimeout(() => { if(successCb) successCb({success: true, message: "Sukses"}); }, 300); },
      });

      window.google = { script: { run: createRunner(null, null) } };
    }
  </script>
</head>
<body class="bg-light-bg dark:bg-dark-bg text-gray-900 dark:text-white transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- REUSABLE: TOAST NOTIFICATION ---
    const Toast = ({ message, onClose }) => {
      useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [message, onClose]);
      if (!message) return null;
      return (
        <div className="fixed top-6 left-1/2 transform -translate-x-1/2 bg-light-surface dark:bg-dark-surface text-gray-900 dark:text-white px-5 py-3 rounded-full border border-light-border dark:border-dark-border shadow-xl z-[9999] text-sm font-bold flex items-center gap-3 toast-enter whitespace-nowrap">
          <span className="material-symbols-outlined text-cyan-500 dark:text-cyan-400 text-lg icon-filled">info</span>
          <span>{message}</span>
        </div>
      );
    };

    // Helper SweetAlert
    const confirmDelete = (isDarkMode, title, text, onConfirm) => {
      Swal.fire({
        title: title || 'Hapus Data?',
        text: text || "Data yang dihapus tidak dapat dikembalikan!",
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: isDarkMode ? '#374151' : '#e5e7eb',
        confirmButtonText: 'Ya, Hapus!', cancelButtonText: 'Batal',
        customClass: { popup: isDarkMode ? 'swal-dark' : 'swal-light', cancelButton: isDarkMode ? '!text-white' : '!text-gray-900' }
      }).then((result) => { if (result.isConfirmed) onConfirm(); });
    };

    // --- SCREEN: LANDING PAGE ---
    const LandingScreen = ({ setPage, isDarkMode, setIsDarkMode, appSettings }) => {
      return (
        <div className="min-h-[100dvh] flex flex-col justify-center items-center p-6 text-center animate-fade-in relative overflow-hidden">
          <img src="https://images.unsplash.com/photo-1517523976439-e29c573a2b27?q=80&w=1600&auto=format&fit=crop" className="absolute inset-0 w-full h-full object-cover z-0" alt="Travel Background" />
          <div className="absolute inset-0 bg-gradient-to-b from-light-bg/70 via-light-bg/90 to-light-bg dark:from-[#121212]/70 dark:via-[#121212]/90 dark:to-[#121212] z-0 transition-colors duration-300"></div>

          <div className="absolute top-[-100px] right-[-100px] w-72 h-72 bg-cyan-400/20 rounded-full blur-3xl pointer-events-none z-0"></div>
          <div className="absolute bottom-[-100px] left-[-100px] w-72 h-72 bg-blue-500/10 rounded-full blur-3xl pointer-events-none z-0"></div>

          <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/50 dark:bg-[#121212]/50 backdrop-blur-md text-gray-800 dark:text-cyan-400 flex items-center justify-center border border-white/50 dark:border-cyan-400/30 shadow-lg transition-all active:scale-90 z-20">
             <span className="material-symbols-outlined text-[20px]">{isDarkMode ? 'light_mode' : 'dark_mode'}</span>
          </button>

          <div className="relative z-10 max-w-sm w-full">
            <div className="w-24 h-24 bg-cyan-400/10 text-cyan-600 dark:text-cyan-400 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-[0_0_30px_rgba(0,209,255,0.2)] border border-cyan-400/20 backdrop-blur-sm">
              <span className="material-symbols-outlined text-5xl icon-filled">flight_takeoff</span>
            </div>
            <h1 className="text-4xl md:text-5xl font-black text-gray-900 dark:text-white mb-4 tracking-tight drop-shadow-lg">{appSettings.app_name || 'IwanTingwe'}<span className="text-cyan-500">.</span></h1>
            <p className="text-[13px] md:text-sm font-medium text-gray-700 dark:text-gray-300 mb-10 leading-relaxed drop-shadow-md">
               Platform SuperApp terbaik untuk merencanakan perjalanan, mengatur itinerary, dan membagi pengeluaran bersama teman-temanmu secara real-time.
            </p>

            <button onClick={() => setPage('login')} className="w-full py-4 bg-cyan-500 dark:bg-cyan-400 hover:bg-cyan-600 dark:hover:bg-cyan-500 text-white dark:text-[#121212] rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-[0_8px_25px_rgba(0,209,255,0.4)] active:scale-95 transition-all flex justify-center items-center gap-2">
              Mulai Sekarang <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
          </div>
        </div>
      );
    };

    // --- SCREEN: LOGIN ---
    const LoginScreen = ({ setPage, setUser, setToken, showToast, isDarkMode, setIsDarkMode, appSettings }) => {
      const [formData, setFormData] = useState({ email: '', password: '' });
      const [loading, setLoading] = useState(false);

      const handleLogin = (e) => {
        e.preventDefault();
        setLoading(true);
        google.script.run
          .withSuccessHandler(res => {
            setLoading(false);
            if (res && res.success) {
              localStorage.setItem('trip_token', res.token);
              setToken(res.token);
              setUser(res.data);
              showToast(res.message);
              setPage('dashboard');
            } else {
              showToast(res ? res.message : "Kesalahan server tidak diketahui.");
            }
          })
          .withFailureHandler(err => {
            setLoading(false);
            showToast("Koneksi gagal: " + err.message);
          })
          .login(formData);
      };

      return (
        <div className="min-h-[100dvh] flex flex-col justify-center items-center p-6 animate-fade-in relative overflow-hidden">
          <img src="https://images.unsplash.com/photo-1476820865390-c52aeebb9891?q=80&w=1600&auto=format&fit=crop" className="absolute inset-0 w-full h-full object-cover z-0" alt="Login Background" />
          <div className="absolute inset-0 bg-light-bg/60 dark:bg-[#121212]/70 backdrop-blur-sm z-0 transition-colors duration-300"></div>

          <div className="absolute top-0 right-0 w-64 h-64 bg-cyan-400/20 rounded-full blur-3xl pointer-events-none z-0"></div>

          <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/50 dark:bg-[#121212]/50 backdrop-blur-md text-gray-800 dark:text-cyan-400 flex items-center justify-center border border-white/50 dark:border-cyan-400/30 shadow-lg transition-all active:scale-90 z-20">
             <span className="material-symbols-outlined text-[20px]">{isDarkMode ? 'light_mode' : 'dark_mode'}</span>
          </button>

          <div className="w-full max-w-sm bg-white/80 dark:bg-[#1a1a1a]/80 backdrop-blur-2xl p-8 rounded-[32px] border border-white/50 dark:border-[#2A2A2A] shadow-2xl z-10 transition-colors duration-300">
            <div className="mb-8 text-center">
               <div className="w-16 h-16 bg-cyan-400/10 text-cyan-600 dark:text-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-cyan-400/20 shadow-inner">
                 <span className="material-symbols-outlined text-3xl icon-filled">lock</span>
               </div>
               <h2 className="text-2xl font-black text-gray-900 dark:text-white mb-2 drop-shadow-sm">Selamat Datang</h2>
               <p className="text-[11px] font-medium text-gray-600 dark:text-gray-400">Silakan masuk untuk melanjutkan ke {appSettings.app_name || 'IwanTingwe'}.</p>
            </div>
            
            <form onSubmit={handleLogin} className="space-y-5">
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-widest text-gray-600 dark:text-gray-400 mb-2">Email Address</label>
                <input type="email" required placeholder="admin@trip.com" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full p-4 rounded-xl outline-none font-bold text-sm transition-all bg-white/50 dark:bg-[#121212]/50 border border-light-border dark:border-dark-border text-gray-900 dark:text-white focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 placeholder-gray-400 dark:placeholder-gray-500 shadow-inner backdrop-blur-sm" />
              </div>
              <div>
                <label className="block text-[10px] font-bold uppercase tracking-widest text-gray-600 dark:text-gray-400 mb-2">Password</label>
                <input type="password" required placeholder="••••••••" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full p-4 rounded-xl outline-none font-bold text-sm transition-all bg-white/50 dark:bg-[#121212]/50 border border-light-border dark:border-dark-border text-gray-900 dark:text-white focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 placeholder-gray-400 dark:placeholder-gray-500 shadow-inner backdrop-blur-sm" />
              </div>
              <button type="submit" disabled={loading} className="w-full py-4 mt-2 bg-cyan-500 dark:bg-cyan-400 text-white dark:text-[#121212] rounded-xl font-black text-[11px] uppercase tracking-widest shadow-[0_4px_15px_rgba(0,209,255,0.4)] active:scale-95 transition-all flex justify-center items-center h-[52px]">
                {loading ? <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white dark:border-[#121212]"></div> : 'Masuk Akun'}
              </button>
            </form>

            <div className="mt-8 text-center pt-6 border-t border-light-border dark:border-dark-border">
               <button onClick={() => setPage('landing')} className="text-[10px] font-bold text-gray-600 hover:text-cyan-600 dark:text-gray-400 dark:hover:text-cyan-400 uppercase tracking-widest transition-colors flex items-center justify-center gap-1 mx-auto">
                 <span className="material-symbols-outlined text-[14px]">arrow_back</span> Kembali
               </button>
            </div>
          </div>
        </div>
      );
    }

    // --- DESKTOP SIDEBAR ---
    const DesktopSidebar = ({ page, setPage, user, isDarkMode, setIsDarkMode, appSettings }) => {
      const menus = [
        { id: 'dashboard', label: 'Home', icon: 'home' },
        { id: 'my_trips', label: 'Trips', icon: 'explore' },
        { id: 'messages', label: 'Alerts', icon: 'notifications' },
        { id: 'profile', label: 'Profile', icon: 'person' },
      ];

      return (
        <aside className="hidden md:flex w-72 flex-col bg-light-bg dark:bg-dark-bg border-r border-light-border dark:border-dark-border z-40 relative transition-colors duration-300">
          <div className="h-24 flex items-center justify-between px-8 border-b border-light-border dark:border-dark-border">
            <div className="flex items-center">
                <div className="w-10 h-10 bg-cyan-400/10 text-cyan-600 dark:text-cyan-400 rounded-xl flex items-center justify-center mr-4 shadow-[0_0_15px_rgba(0,209,255,0.1)] border border-cyan-400/20">
                   <span className="material-symbols-outlined icon-filled">flight_takeoff</span>
                </div>
                <h2 className="font-black text-gray-900 dark:text-white text-2xl tracking-tight">{appSettings.app_name || 'IwanTingwe'}</h2>
            </div>
            <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 dark:hover:bg-white/10 transition-colors">
               <span className="material-symbols-outlined text-[20px]">{isDarkMode ? 'light_mode' : 'dark_mode'}</span>
            </button>
          </div>
          <nav className="flex-1 px-5 py-8 space-y-3">
            <p className="px-3 text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-4">Menu Utama</p>
            {menus.map(m => (
              <button key={m.id} onClick={() => setPage(m.id)} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-xl text-sm font-bold transition-all ${page === m.id ? 'bg-cyan-400/10 text-cyan-600 dark:text-cyan-400' : 'text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5 hover:text-gray-900 dark:hover:text-gray-300'}`}>
                <span className={`material-symbols-outlined ${page === m.id ? 'icon-filled drop-shadow-[0_0_8px_rgba(0,209,255,0.3)]' : ''}`}>{m.icon}</span>
                <span>{m.label}</span>
              </button>
            ))}
            <div className="my-6 border-t border-light-border dark:border-dark-border"></div>
            <button onClick={() => setPage('create_trip')} className={`w-full flex items-center justify-center gap-2 px-4 py-4 rounded-xl text-sm font-black transition-all active:scale-95 ${page === 'create_trip' ? 'bg-cyan-500 dark:bg-cyan-400 text-white dark:text-[#121212] shadow-[0_4px_20px_rgba(0,209,255,0.4)]' : 'bg-light-surface dark:bg-dark-surface text-cyan-600 dark:text-cyan-400 border border-light-border dark:border-dark-border hover:border-cyan-400/50'}`}>
              <span className="material-symbols-outlined">add</span> <span>Create Trip</span>
            </button>
          </nav>
        </aside>
      );
    };

    // --- SUPERAPP MOBILE BOTTOM NAV ---
    const MobileBottomNav = ({ page, setPage }) => {
      if (!['dashboard', 'my_trips', 'messages', 'profile'].includes(page)) return null;
      
      return (
        <nav className="md:hidden fixed bottom-0 left-0 w-full bg-white/90 dark:bg-[#121212]/90 backdrop-blur-2xl border-t border-light-border dark:border-dark-border z-[100] shadow-[0_-4px_30px_rgba(0,0,0,0.1)] dark:shadow-[0_-4px_30px_rgba(0,0,0,0.8)] pb-safe transition-colors duration-300">
          <div className="flex justify-between items-center w-full px-6 h-[72px] relative">
            
            <div className="flex justify-between items-center w-[35%] pt-1">
              <div onClick={() => setPage('dashboard')} className={`flex flex-col items-center justify-center cursor-pointer transition-all ${page === 'dashboard' ? 'text-cyan-600 dark:text-cyan-400' : 'text-gray-400 dark:text-gray-500'}`}>
                <span className={`material-symbols-outlined text-[26px] ${page === 'dashboard' ? 'icon-filled drop-shadow-[0_0_8px_rgba(0,209,255,0.4)]' : ''}`}>home</span>

        google.script.run
          .withSuccessHandler(res => {
            if(res && res.success) setAlerts(res.data || []);
            setLoading(false);

          .withFailureHandler(err => {
            showToast("Gagal memuat alert: " + err.message);
            setLoading(false);
          })
          .getMyAlerts(user.email);

      useEffect(() => { loadAlerts(); }, []);

        google.script.run
          .withSuccessHandler(() => {
            setAlerts(alerts.map(a => a.alert_id === id ? {...a, is_read: 'true'} : a));
          })
          .markAlertAsRead(id);

              showToast(res ? res.message : "Gagal");

    // --- SCREEN: TRIP DETAIL ---
    const TripDetailScreen = ({ trip, user, setPage, showToast, refreshTrips, onEditTrip, isDarkMode, appSettings }) => {
      const [activeTab, setActiveTab] = useState('itinerary');
      const [loading, setLoading] = useState(false);

      // State untuk Date Picker Horizontal
      const [selectedDate, setSelectedDate] = useState(trip.start_date);

      // Helper: Generate list tanggal antara start dan end
      const getDatesInRange = (start, end) => {
        const dates = [];
        let curr = new Date(start);
        const last = new Date(end);
        while (curr <= last) {
          dates.push(new Date(curr).toISOString().split('T')[0]);
          curr.setDate(curr.getDate() + 1);
        }
        return dates;
      };

      const dateRange = getDatesInRange(trip.start_date, trip.end_date);

      const myRoleObj = members.find(m => m.email === user?.email);
      const myRole = myRoleObj ? myRoleObj.role : (trip.creator === user?.email ? 'owner' : 'member'); 
      const isAdmin = myRole === 'owner' || myRole === 'admin';

      const loadData = (forceFull = false) => {
        // Jika sudah ada data dan bukan permintaan paksa/laporan, jangan tampilkan loading berat
        if (!forceFull && activeTab !== 'report' && (itinerary.length > 0 || expenses.length > 0)) {
           // Tetap fetch di background tapi tanpa spinner full-screen
        } else {
           setLoading(true);

        if (activeTab === 'itinerary') {

            .withSuccessHandler(res => { if(res && res.success) setItinerary(res.data || []); setLoading(false); })
            .withFailureHandler(err => { showToast("Gagal: " + err.message); setLoading(false); })
            .getItinerary(trip.trip_id); 
            
          google.script.run.withSuccessHandler(res => { if(res && res.success) setMembers(res.data || []); }).getMembers(trip.trip_id);
        } else if (activeTab === 'expenses') { 
          google.script.run
            .withSuccessHandler(res => { 
              if(res && res.success) setExpenses(res.data || []); 
              google.script.run
                .withSuccessHandler(bal => { if(bal && bal.success) setBalances({ data: bal.data || [], total: bal.total_expense || 0, income: bal.total_income || 0, budget: bal.total_budget || 0, per_person: bal.per_person_budget || 0 }); setLoading(false); })
                .withFailureHandler(err => { showToast("Gagal: " + err.message); setLoading(false); })
                .getBalances(trip.trip_id); 
            })
            .withFailureHandler(err => { showToast("Gagal: " + err.message); setLoading(false); })
            .getExpenses(trip.trip_id); 
        } else if (activeTab === 'settle_up') {
          google.script.run
            .withSuccessHandler(bal => { if(bal && bal.success) setBalances({ data: bal.data || [], total: bal.total_expense || 0, income: bal.total_income || 0, budget: bal.total_budget || 0, per_person: bal.per_person_budget || 0 }); setLoading(false); })
            .withFailureHandler(err => { showToast("Gagal: " + err.message); setLoading(false); })
            .getBalances(trip.trip_id);
        } else if (activeTab === 'members') {

            .withSuccessHandler(res => { if(res && res.success) setMembers(res.data || []); setLoading(false); })
            .withFailureHandler(err => { showToast("Gagal: " + err.message); setLoading(false); })
            .getMembers(trip.trip_id);

          google.script.run
            .withSuccessHandler(res => { if(res && res.success) setTasks(res.data || []); setLoading(false); })

            .getTasks(trip.trip_id);

        } else if (activeTab === 'report') {

      const handleSettleUp = (balanceAmount) => {
        const remainingHutang = Math.abs(balanceAmount);
        
        Swal.fire({
          title: 'Pembayaran Iuran', 
          html: `
            <div class="text-left space-y-4">
              <p class="text-sm mb-4">Sisa iuran yang harus dibayar: <b class="text-cyan-600">${trip.currency} ${remainingHutang.toLocaleString('id-ID')}</b></p>
              
              <div class="flex gap-2 mb-4">

              </div>
            </div>

          showConfirmButton: false,
          cancelButtonText: 'Batal',

              const fileInput = document.getElementById('swal-file');
              const file = fileInput.files[0];
              
              if (!amt || amt <= 0) return Swal.showValidationMessage('Masukkan nominal yang valid');

              setLoading(true);
              Swal.close();

              const handleUpload = (fData, fName) => {
                const payload = { 
                  description: type === 'LUNAS' ? 'Pelunasan Iuran Trip' : 'Pembayaran DP Iuran Trip', 
                  amount: amt, 
                  category: 'Settle Up', 
                  date: new Date().toISOString().split('T')[0], 
                  trip_id: trip.trip_id, 
                  currency: trip.currency, 
                  paid_by: user.email,
                  fileData: fData,
                  fileName: fName
                };
                google.script.run
                  .withSuccessHandler(res => { showToast(res ? res.message : "Sukses"); loadData(); })
                  .withFailureHandler(e => { showToast(e.message); setLoading(false); })
                  .addExpense(payload);
              };

              if (file) {
                const reader = new FileReader();
                reader.onload = (e) => handleUpload(e.target.result, file.name);
                reader.readAsDataURL(file);
              } else {
                handleUpload(null, "");
              }
            };

                   <div className="text-right space-y-2 shrink-0">
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Periode Perjalanan</p>
                      <p className="text-lg font-black text-gray-900 dark:text-white">{new Date(trip.start_date).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}</p>
                      <p className="text-sm font-bold text-gray-500 tracking-tighter">sampai {new Date(trip.end_date).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'})}</p>
                      <div className={`mt-4 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest border ${trip.status === 'completed' ? 'bg-green-50 text-green-600 border-green-200' : 'bg-cyan-50 text-cyan-600 border-cyan-200'}`}>
                         <span className="material-symbols-outlined text-[14px]">{trip.status === 'completed' ? 'verified' : 'pending'}</span>
                         <span>{trip.status === 'completed' ? 'Selesai' : 'Aktif'}</span>
                      </div>
                   </div>
                </div>

                {/* Grid Statistik */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-12 mb-12">
                   {/* Analisis Keuangan */}
                   <div className="space-y-6">
                      <h4 className="text-[11px] font-black uppercase tracking-[0.2em] text-gray-400 border-b border-gray-100 dark:border-white/5 pb-2">Analisis Keuangan</h4>
                      <div className="space-y-5">
                         <div className="flex justify-between items-end">
                            <span className="text-xs font-bold text-gray-500">Total Anggaran (Budget)</span>
                            <span className="text-xl font-black text-gray-900 dark:text-white">Rp {balances.budget.toLocaleString('id-ID')}</span>
                         </div>
                         <div className="flex justify-between items-end">
                            <span className="text-xs font-bold text-gray-500">Total Pengeluaran Real</span>
                            <span className="text-xl font-black text-red-500">Rp {balances.total.toLocaleString('id-ID')}</span>
                         </div>
                         <div className="w-full bg-gray-100 dark:bg-white/5 h-2 rounded-full overflow-hidden">
                            <div 
                              className={`h-full transition-all duration-1000 ${balances.total > balances.budget ? 'bg-red-500' : 'bg-cyan-500'}`}
                              style={{ width: `${Math.min((balances.total / (balances.budget || 1)) * 100, 100)}%` }}
                            ></div>
                         </div>
                         <div className="flex justify-between items-center text-[10px] font-bold uppercase">
                            <span className={balances.total > balances.budget ? 'text-red-500' : 'text-cyan-600'}>
                               {balances.total > balances.budget ? 'Melebihi Anggaran' : 'Dalam Batas Anggaran'}
                            </span>
                            <span className="text-gray-400">Pemanfaatan: {((balances.total / (balances.budget || 1)) * 100).toFixed(1)}%</span>
                         </div>
                      </div>
                   </div>

                   {/* Statistik Operasional */}
                   <div className="space-y-6">
                      <h4 className="text-[11px] font-black uppercase tracking-[0.2em] text-gray-400 border-b border-gray-100 dark:border-white/5 pb-2">Statistik Operasional</h4>
                      <div className="grid grid-cols-2 gap-4">
                         <div className="p-5 bg-gray-50 dark:bg-white/5 rounded-[24px]">
                            <p className="text-[9px] font-bold text-gray-400 uppercase mb-1">Partisipan</p>
                            <p className="text-2xl font-black text-gray-900 dark:text-white">{members.length} <span className="text-[10px] text-gray-500 font-bold uppercase">Orang</span></p>
                         </div>
                         <div className="p-5 bg-gray-50 dark:bg-white/5 rounded-[24px]">
                            <p className="text-[9px] font-bold text-gray-400 uppercase mb-1">Tugas Selesai</p>
                            <p className="text-2xl font-black text-gray-900 dark:text-white">
                               {tasks.filter(t => String(t.completed) === 'true').length} / {tasks.length}
                            </p>
                         </div>
                         <div className="p-5 bg-gray-50 dark:bg-white/5 rounded-[24px]">
                            <p className="text-[9px] font-bold text-gray-400 uppercase mb-1">Biaya Per Orang</p>
                            <p className="text-md font-black text-cyan-600 dark:text-cyan-400">Rp {balances.per_person.toLocaleString('id-ID')}</p>
                         </div>
                         <div className="p-5 bg-gray-50 dark:bg-white/5 rounded-[24px]">
                            <p className="text-[9px] font-bold text-gray-400 uppercase mb-1">Total Hari</p>
                            <p className="text-2xl font-black text-gray-900 dark:text-white">{Math.ceil((new Date(trip.end_date) - new Date(trip.start_date)) / (1000 * 60 * 60 * 24)) + 1} <span className="text-[10px] text-gray-500 font-bold uppercase">Hari</span></p>
                         </div>
                      </div>
                   </div>
                </div>

                {/* Rincian Kategori Pengeluaran */}
                <div className="mb-12">
                   <h4 className="text-[11px] font-black uppercase tracking-[0.2em] text-gray-400 border-b border-gray-100 dark:border-white/5 pb-2 mb-6">Distribusi Pengeluaran</h4>
                   <div className="overflow-hidden border border-gray-100 dark:border-white/5 rounded-[28px]">
                      <table className="w-full text-left">
                         <thead>
                            <tr className="bg-gray-50 dark:bg-white/5 text-[10px] font-black uppercase tracking-widest text-gray-400">
                               <th className="px-6 py-4">Kategori</th>
                               <th className="px-6 py-4">Total Nominal</th>
                               <th className="px-6 py-4">Kontribusi</th>
                            </tr>
                         </thead>
                         <tbody className="divide-y divide-gray-100 dark:divide-white/5">
                            {['Makanan', 'Transportasi', 'Akomodasi', 'Lainnya'].map(cat => {
                               const total = expenses.filter(e => e.category === cat).reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
                               const percent = balances.total > 0 ? (total / balances.total) * 100 : 0;
                               return (
                                  <tr key={cat} className="text-sm font-bold text-gray-700 dark:text-gray-300">
                                     <td className="px-6 py-4">{cat}</td>
                                     <td className="px-6 py-4 font-black text-gray-900 dark:text-white text-base">Rp {total.toLocaleString('id-ID')}</td>
                                     <td className="px-6 py-4">
                                        <div className="flex items-center gap-3">
                                           <div className="flex-1 h-1.5 bg-gray-100 dark:bg-white/5 rounded-full overflow-hidden">
                                              <div className="h-full bg-cyan-500/50" style={{width: `${percent}%`}}></div>
                                           </div>
                                           <span className="text-[10px] w-8 text-right">{percent.toFixed(0)}%</span>
                                        </div>
                                     </td>
                                  </tr>
                               );
                            })}
                         </tbody>
                      </table>
                   </div>
                </div>

                {/* Footer Laporan */}
                <div className="mt-20 pt-10 border-t-2 border-gray-100 dark:border-white/5 flex flex-col md:flex-row justify-between items-center gap-8">
                   <div className="text-center md:text-left">
                      <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Dibuat Oleh Sistem Pada</p>
                      <p className="text-sm font-black text-gray-900 dark:text-white">{new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'})}</p>
                   </div>
                   <div className="flex items-center gap-3 grayscale opacity-50">
                      <span className="material-symbols-outlined text-3xl">travel_explore</span>
                      <span className="font-black text-lg uppercase tracking-tighter text-gray-900 dark:text-white italic">{appSettings.app_name || 'IwanTingwe'}</span>
                   </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: MEMBERS */}
          {!loading && activeTab === 'members' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="bg-light-surface dark:bg-[#1a1a1a] rounded-[32px] border border-light-border dark:border-dark-border shadow-lg p-6 md:p-8 transition-colors duration-300">
                <div className="flex justify-between items-center mb-8">
                  <h3 className="font-black text-xl text-gray-900 dark:text-white"><span>Anggota Grup</span></h3>
                  <span className="bg-light-bg dark:bg-dark-bg border border-light-border dark:border-dark-border text-gray-500 dark:text-gray-400 font-bold text-[10px] uppercase tracking-widest px-3 py-1.5 rounded-lg"><span>{members.length} Orang</span></span>
                </div>
                <div className="space-y-4">
                  {members.map((mem) => (
                    <div key={mem.member_id} className="flex justify-between items-center p-4 border border-light-border dark:border-dark-border rounded-[24px] bg-light-bg dark:bg-dark-bg hover:border-gray-200 dark:hover:border-[#3a3a3a] transition group">
                      <div className="flex items-center gap-4">
                        <div className={`w-12 h-12 rounded-full flex items-center justify-center font-black text-white dark:text-[#121212] text-[15px] ${mem.role === 'owner' ? 'bg-cyan-500 dark:bg-cyan-400 shadow-[0_0_10px_rgba(0,209,255,0.4)]' : 'bg-gray-400'}`}>
                          <span>{mem.name.charAt(0).toUpperCase()}</span>
                        </div>
                        <div>
                          <h4 className="font-black text-sm text-gray-900 dark:text-white uppercase tracking-wider mb-1"><span>{mem.name}</span> {mem.email === user?.email && <span className="text-cyan-600 dark:text-cyan-400 ml-1 text-[10px]">(Anda)</span>}</h4>
                          <p className="text-[10px] font-medium text-gray-500"><span>{mem.email}</span></p>
                        </div>
                      </div>
                      <div className="flex items-center gap-3">
                         <span className={`text-[9px] px-3 py-1.5 rounded-md font-bold uppercase tracking-widest border ${mem.role === 'owner' ? 'bg-cyan-50 dark:bg-cyan-400/10 text-cyan-600 dark:text-cyan-400 border-cyan-200 dark:border-cyan-400/30' : 'bg-gray-200 dark:bg-[#252525] text-gray-500 dark:text-gray-400 border-light-border dark:border-dark-border'}`}>
                           <span>{mem.role}</span>
                         </span>
                         {isAdmin && mem.email !== user?.email && (
                            <button onClick={() => deleteMember(mem.member_id)} className="text-gray-500 hover:text-red-500 transition opacity-100 md:opacity-0 group-hover:opacity-100 p-1"><span className="material-symbols-outlined text-[18px]">person_remove</span></button>
                         )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div>
                {isAdmin ? (
                  <form onSubmit={submitMember} className="p-8 rounded-[32px] border bg-light-surface dark:bg-[#1a1a1a] border-light-border dark:border-dark-border sticky top-6 shadow-lg transition-colors duration-300">
                    <h3 className="font-black text-[13px] uppercase tracking-widest mb-3 text-gray-900 dark:text-white flex items-center gap-2"><span className="material-symbols-outlined text-cyan-600 dark:text-cyan-400 text-[20px]">person_add</span> <span>Undang Teman</span></h3>
                    <p className="text-[11px] font-medium mb-8 text-gray-500 dark:text-gray-400 leading-relaxed"><span>Tambahkan email Google teman Anda agar mereka bisa mengakses itinerary dan patungan otomatis.</span></p>
                    <div className="space-y-5">
                      <div>
                        <label className={labelClass}><span>Email Address</span></label>
                        <input type="email" required placeholder="teman@gmail.com" value={memForm.email} onChange={e => setMemForm({...memForm, email: e.target.value})} className={inputClass} />
                      </div>
                      <div>
                        <label className={labelClass}><span>Akses Role</span></label>
                        <select value={memForm.role} onChange={e => setMemForm({...memForm, role: e.target.value})} className={inputClass}>
                          <option value="member">Hanya Member</option>
                          <option value="admin">Admin Kelola</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full py-4 bg-cyan-500 dark:bg-cyan-400 text-white dark:text-[#121212] rounded-xl font-black text-[11px] uppercase tracking-widest shadow-[0_4px_15px_rgba(0,209,255,0.4)] hover:bg-cyan-600 dark:hover:bg-cyan-500 transition flex justify-center items-center gap-2 mt-4 active:scale-95">
                        <span className="material-symbols-outlined text-[18px]">send</span> <span>Kirim Undangan</span>
                      </button>
                    </div>
                  </form>
                ) : (
                  <div className="p-10 rounded-[32px] text-center border font-bold bg-light-surface dark:bg-[#1a1a1a] border-light-border dark:border-dark-border text-gray-500 transition-colors duration-300">
                    <div className="w-16 h-16 bg-light-bg dark:bg-dark-bg rounded-full flex items-center justify-center mx-auto mb-5 border border-light-border dark:border-dark-border">
                      <span className="material-symbols-outlined text-4xl text-gray-400 dark:text-gray-600">gpp_maybe</span>
                    </div>
                    <p className="text-[11px] uppercase tracking-widest leading-relaxed"><span>Hanya Admin yang memiliki akses untuk mengundang anggota baru ke dalam grup trip ini.</span></p>
                  </div>
                )}
              </div>
            </div>
          )}
          
          {/* Detail FAB for mobile (Quick Add) */}
          {isAdmin && activeTab === 'itinerary' && (
            <button onClick={() => setShowItinForm(!showItinForm)} className="md:hidden fixed right-6 bottom-[104px] w-[56px] h-[56px] bg-cyan-500 dark:bg-cyan-400 text-white dark:text-[#121212] rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(0,209,255,0.4)] active:scale-90 transition-transform z-40">
               <span className="material-symbols-outlined text-3xl font-black">{showItinForm ? "close" : "add"}</span>
            </button>
          )}
          {activeTab === 'expenses' && (
            <button onClick={() => setShowExpForm(!showExpForm)} className="md:hidden fixed right-6 bottom-[104px] w-[56px] h-[56px] bg-cyan-500 dark:bg-cyan-400 text-white dark:text-[#121212] rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(0,209,255,0.4)] active:scale-90 transition-transform z-40">
               <span className="material-symbols-outlined text-3xl font-black">{showExpForm ? "close" : "add"}</span>
            </button>
          )}
          {activeTab === 'tasks' && (
            <button onClick={() => setShowTaskForm(!showTaskForm)} className="md:hidden fixed right-6 bottom-[104px] w-[56px] h-[56px] bg-cyan-500 dark:bg-cyan-400 text-white dark:text-[#121212] rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(0,209,255,0.4)] active:scale-90 transition-transform z-40">
               <span className="material-symbols-outlined text-3xl font-black">{showTaskForm ? "close" : "add"}</span>
            </button>
          )}
          
        </div>
      );
    };

    // --- MAIN APP ---
    const App = () => {
      // SETTING SPA: Mulai dari Landing Page
      const [page, setPage] = useState('landing');
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('trip_token'));
      const [trips, setTrips] = useState([]);
      const [selectedTrip, setSelectedTrip] = useState(null);
      const [isLoading, setIsLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState("");
      
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [appSettings, setAppSettings] = useState({ app_name: 'IwanTingwe' });

      // Load App Settings
      useEffect(() => {
        google.script.run
          .withSuccessHandler(res => {
            if(res && res.success) setAppSettings(res.data);
          })
          .getAppSettings();
      }, []);

      // Cek Session saat Aplikasi dibuka
      useEffect(() => {
        if (token) {
          setIsLoading(true);
          google.script.run
            .withSuccessHandler(res => {
              setIsLoading(false);
              if (res) {
                setUser(res);
                setPage('dashboard');
              } else {
                localStorage.removeItem('trip_token');
                setToken(null);
              }
            })
            .withFailureHandler(() => {
              setIsLoading(false);
              localStorage.removeItem('trip_token');
              setToken(null);
            })
            .getCurrentUser(token);
        }
      }, []);

      const loadTrips = () => { 
         if(!user) return;
         setIsLoading(true); 
         google.script.run
           .withSuccessHandler(res => { 
              setIsLoading(false);
              if(res && res.success) setTrips(res.data || []); 
              else setToastMsg(res ? res.message : "Data bermasalah");
           })
           .withFailureHandler(err => {
              setIsLoading(false);
              setToastMsg("Gagal memuat trip: " + err.message);
           })
           .getMyTrips(user.email); 
      };

      useEffect(() => { 
         if (user && page !== 'landing' && page !== 'login') {
            loadTrips(); 
         }
      }, [user, page]);

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark'); 
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      const handleLogout = (t) => {
        google.script.run
          .withSuccessHandler(() => {
            localStorage.removeItem('trip_token');
            setToken(null);
            setUser(null);
            setPage('landing');
            setToastMsg("Anda telah keluar");
          })
          .logout(t);
      };

      const showNav = !['landing', 'login'].includes(page);

      return (
        <div className="flex h-screen overflow-hidden text-gray-900 dark:text-white bg-light-bg dark:bg-dark-bg selection:bg-cyan-400/30 font-['Inter'] transition-colors duration-300">
          <Toast message={toastMsg} onClose={() => setToastMsg("")} />
          
          {showNav && <DesktopSidebar page={page} setPage={setPage} user={user} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} appSettings={appSettings} />}
          
          <div className="flex-1 flex flex-col relative h-full w-full overflow-hidden">
            <main className="flex-1 overflow-x-hidden overflow-y-auto w-full relative">
              {isLoading && !user && (
                <div className="absolute inset-0 bg-light-bg dark:bg-dark-bg z-[100] flex items-center justify-center">
                  <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-500"></div>
                </div>
              )}

              {page === 'landing' && <LandingScreen setPage={setPage} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} appSettings={appSettings} />}
              {page === 'login' && <LoginScreen setPage={setPage} setUser={setUser} setToken={setToken} showToast={setToastMsg} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} appSettings={appSettings} />}
              
              {page === 'dashboard' && <DashboardScreen user={user} setPage={setPage} trips={trips} isLoading={isLoading} onSelectTrip={(t) => { setSelectedTrip(t); setPage('trip_detail'); }} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} />}
              {page === 'my_trips' && <MyTripsScreen setPage={setPage} trips={trips} onSelectTrip={(t) => { setSelectedTrip(t); setPage('trip_detail'); }} />}
              {page === 'messages' && <MessagesScreen user={user} showToast={setToastMsg} refreshTrips={loadTrips} />}
              {page === 'profile' && <ProfileScreen user={user} token={token} onLogout={handleLogout} showToast={setToastMsg} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} appSettings={appSettings} setAppSettings={setAppSettings} />}
              
              {page === 'create_trip' && <CreateTripScreen setPage={setPage} refreshTrips={loadTrips} showToast={setToastMsg} user={user} />}
              {page === 'edit_trip' && <CreateTripScreen setPage={setPage} refreshTrips={loadTrips} showToast={setToastMsg} initialData={selectedTrip} user={user} />}
              {page === 'trip_detail' && <TripDetailScreen trip={selectedTrip} user={user} setPage={setPage} showToast={setToastMsg} refreshTrips={loadTrips} onEditTrip={(t) => { setSelectedTrip(t); setPage('edit_trip'); }} isDarkMode={isDarkMode} appSettings={appSettings} />}
            </main>
            
            {showNav && <MobileBottomNav page={page} setPage={setPage} />}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
